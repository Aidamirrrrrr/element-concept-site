<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Страница не найдена — ELEMENT by МОСК</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#EDECE7">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/fonts.css">
<link rel="stylesheet" href="css/style.css">
<style>
  .nf{min-height:100svh;display:grid;place-items:center;padding:var(--gutter);text-align:center}
  .nf__code{font-family:var(--mono);font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--red)}
  .nf h1{font-family:var(--display);font-weight:200;font-size:clamp(30px,6vw,72px);
    line-height:1.05;letter-spacing:-.028em;padding:14px 0 16px;text-wrap:balance}
  .nf p{color:var(--muted);max-width:44ch;margin-inline:auto}
  .nf a{display:inline-block;margin-top:28px;border:1px solid var(--ink);border-radius:999px;
    padding:13px 26px;font-size:14px;font-weight:600;transition:background .35s,color .35s}
  .nf a:hover{background:var(--ink);color:var(--bone)}
</style>
</head>
<body>
  <main class="nf">
    <div>
      <p class="nf__code">Ошибка 404</p>
      <h1>Этой страницы нет</h1>
      <p>Возможно, ссылка устарела. Вернитесь на главную — там услуги, коллекция ваз и кейсы студии.</p>
      <a href="./">На главную</a>
    </div>
  </main>
</body>
</html>
